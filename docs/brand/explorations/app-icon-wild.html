<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiili icon, wild round</title>
<style>
  @font-face { font-family: "Geist Mono"; src: url("../../../src/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1011; color: #e9e2d8; font: 13px/1.5 "Geist Mono", ui-monospace, monospace; padding: 24px 16px 64px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { color: #9a948c; margin: 0 0 24px; max-width: 70ch; }
  .dock { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; padding: 12px 18px 16px; margin: 0 0 20px; border-radius: 22px; width: max-content; max-width: 100%;
    background: linear-gradient(180deg, rgba(120,40,60,.55), rgba(70,20,40,.75)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .dock figure { margin: 0; display: grid; justify-items: center; gap: 6px; }
  .dock figcaption { font-size: 11px; color: #f2d9dd; }
  .dock.light { background: linear-gradient(180deg, rgba(240,226,230,.9), rgba(220,200,210,.9)); }
  .dock.light figcaption { color: #4a2c34; }
  .variant { display: grid; grid-template-columns: 220px 1fr; gap: 16px 24px; padding: 20px 0; border-top: 1px solid #222a2c; }
  .variant h2 { font-size: 14px; margin: 0; }
  .variant p { color: #9a948c; margin: 4px 0 0; }
  .sizes { display: flex; flex-wrap: wrap; gap: 20px; align-items: end; }
  .pair { display: flex; gap: 12px; align-items: end; padding: 12px; border-radius: 12px; background: #161b1d; }
  .pair.light { background: #ece4d8; }
  img { display: block; }
  @media (max-width: 720px) { .variant { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>tiili app icon: the wild round</h1>
<p class="lead">Ten takes on variant 11: the full-width &gt;_ brick, the staggered courses and the prompt at the margin. If none of them lands, 11 it is.</p>
<div class="dock" id="dock-dark"></div>
<div class="dock light" id="dock-light"></div>
<div id="variants"></div>

<script>
const C = { tiili: "#A4472B", klinkkeri: "#6B2A1E", savi: "#C9764F", koski: "#111617", kalkki: "#F6F1E9", laasti: "#E8DECD",
  ground: "#182023", ink: "#2A2321", muratti: "#861B22", koivu: "#D9A43A", ikkuna: "#8FA6A4", sammal: "#6E7F4E", taivas: "#6F97B3" };

// ---- variant 11's geometry, in mark units: 7-high courses above and below a 28 × 18 focus brick ----
const FOCUS = [12, 12, 28, 18];
const SHIFT = 4;
const WALL = [
  [0 - SHIFT, 0, 25, 10], [27 - SHIFT, 0, 25, 10],
  [0, 12, 10, 18], [42, 12, 10, 18],
  [0 + SHIFT, 32, 25, 10], [27 + SHIFT, 32, 25, 10],
];
const K = 100 / 28;

const rect = ([x, y, w, h], fill, rx = 1.5, extra = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;

/** Where 11's prompt sits in a box: chevron height `ch`, its left `x0`, centre line `cy`, and the underscore. */
function geom([x, y, w, h], size = 0.56) {
  const ch = h * size, cw = ch * 0.62, gap = ch * 0.32, curW = ch * 0.85;
  const x0 = x + w * 0.17, cy = y + h / 2;
  return { ch, cw, x0, cy, cx: x0 + cw + gap, curW };
}
function prompt(box, { color, stroke = 2.6, size = 0.56, dx = 0, dy = 0 }) {
  const g = geom(box, size);
  const x0 = g.x0 + dx, cy = g.cy + dy;
  return `<path d="M${x0} ${cy - g.ch / 2} L${x0 + g.cw} ${cy} L${x0} ${cy + g.ch / 2}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="square" stroke-linejoin="miter"/>` +
    `<rect x="${g.cx + dx}" y="${cy + g.ch / 2 - stroke / 2}" width="${g.curW}" height="${stroke}" fill="${color}"/>`;
}

/** The icon: ground, then the mark scaled by `k` about the focus brick's centre (optionally rotated), clipped to the squircle. */
function icon(light, mark, { k = K, ground, defs = "", rotate = 0 } = {}) {
  const [fx, fy, fw, fh] = FOCUS;
  const tx = 50 - (fx + fw / 2) * k, ty = 50 - (fy + fh / 2) * k;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>${defs}<clipPath id="sq"><rect width="100" height="100" rx="22.5"/></clipPath></defs>
    <rect width="100" height="100" rx="22.5" fill="${ground ?? (light ? C.kalkki : C.ground)}"/>
    <g clip-path="url(#sq)"><g transform="rotate(${rotate} 50 50) translate(${tx} ${ty}) scale(${k})">${mark}</g></g></svg>`;
}

const focusFill = (light) => (light ? C.klinkkeri : C.savi);
const glyphInk = (light) => (light ? "#FFFFFF" : C.koski);
const plainWall = (fill = C.tiili) => WALL.map((r) => rect(r, fill)).join("");
function rng(seed) { return () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const VARIANTS = [
  {
    name: "11 · Prompt at the margin",
    note: "The runner-up, for comparison.",
    svg: (light) => icon(light, plainWall() + rect(FOCUS, focusFill(light)) + prompt(FOCUS, { color: glyphInk(light) })),
  },
  {
    name: "12 · Phosphor",
    note: "The focus brick is an old CRT: a dark glass face with faint scanlines and a glowing savi prompt.",
    svg: (light) => {
      const glass = light ? C.ink : C.koski;
      const defs = `<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <pattern id="scan" width="1" height="1.2" patternUnits="userSpaceOnUse"><rect width="1" height="0.45" fill="#ffffff" opacity="0.06"/></pattern>
        <radialGradient id="tube" cx="0.35" cy="0.45" r="0.8"><stop offset="0" stop-color="#2a3a38"/><stop offset="1" stop-color="${glass}"/></radialGradient>`;
      const mark = plainWall() + rect(FOCUS, "url(#tube)") + rect(FOCUS, "url(#scan)") +
        `<g filter="url(#glow)">${prompt(FOCUS, { color: "#F0A070" })}</g>`;
      return icon(light, mark, { defs });
    },
  },
  {
    name: "13 · Mortar inlay",
    note: "The >_ is cut into the brick and pointed with mortar, the way a builder's mark is: a pale groove with a shadow on its upper edge.",
    svg: (light) => {
      const face = light ? C.tiili : C.savi;
      const mark = plainWall(light ? C.klinkkeri : C.tiili) + rect(FOCUS, face) +
        prompt(FOCUS, { color: "rgba(0,0,0,.35)", dy: -0.55, stroke: 3 }) + prompt(FOCUS, { color: C.laasti, stroke: 2.6 });
      return icon(light, mark);
    },
  },
  {
    name: "14 · Fired clay",
    note: "Every brick gets pores and specks and a faint gradient, like a hand-made Tampere brick seen up close.",
    svg: (light) => {
      const defs = `<linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#000000" stop-opacity=".18"/></linearGradient>`;
      const specks = (r, seed, tone) => {
        const rand = rng(seed); let out = "";
        for (let i = 0; i < 26; i++) {
          const x = r[0] + 0.8 + rand() * (r[2] - 1.6), y = r[1] + 0.8 + rand() * (r[3] - 1.6);
          out += `<circle cx="${x}" cy="${y}" r="${0.12 + rand() * 0.3}" fill="${rand() < 0.5 ? "#000" : tone}" opacity="${0.12 + rand() * 0.2}"/>`;
        }
        return out;
      };
      const mark = WALL.map((r, i) => rect(r, C.tiili) + rect(r, "url(#fire)") + specks(r, i + 1, "#F3C9A6")).join("") +
        rect(FOCUS, focusFill(light)) + rect(FOCUS, "url(#fire)") + specks(FOCUS, 99, "#FFE3CC") + prompt(FOCUS, { color: glyphInk(light) });
      return icon(light, mark, { defs });
    },
  },
  {
    name: "15 · Pressed",
    note: "Bricks with depth: a lit top edge, a shaded bottom, a shadow under the focus brick and a >_ pressed into it.",
    svg: (light) => {
      const bevel = (r) => rect(r, "url(#bevel)");
      const defs = `<linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".12" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
        <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="0.9" flood-color="#000" flood-opacity=".55"/></filter>`;
      const mark = WALL.map((r) => rect(r, C.tiili) + bevel(r)).join("") +
        `<g filter="url(#drop)">${rect(FOCUS, focusFill(light))}</g>` + bevel(FOCUS) +
        prompt(FOCUS, { color: light ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.35)", dy: 0.5 }) + prompt(FOCUS, { color: glyphInk(light) });
      return icon(light, mark, { defs });
    },
  },
  {
    name: "16 · Off kilter",
    note: "The whole wall is laid a few degrees off true, like a photo of it taken in passing. The prompt rides with it.",
    svg: (light) => icon(light, plainWall() + rect(FOCUS, focusFill(light)) + prompt(FOCUS, { color: glyphInk(light) }), { k: K * 1.12, rotate: -7 }),
  },
  {
    name: "17 · Maker's frog",
    note: "Real bricks carry a recessed panel, the frog, with the maker's stamp. Here the frog holds the >_.",
    svg: (light) => {
      const [x, y, w, h] = FOCUS, frog = [x + 2.4, y + 2.6, w - 4.8, h - 5.2];
      const deep = light ? "#4E1D14" : "#A85E3C";
      const defs = `<linearGradient id="frog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".25" stop-color="#000" stop-opacity="0"/></linearGradient>`;
      const mark = plainWall() + rect(FOCUS, focusFill(light)) + rect(frog, deep, 1.2) + rect(frog, "url(#frog)", 1.2) +
        `<rect x="${frog[0]}" y="${frog[1]}" width="${frog[2]}" height="${frog[3]}" rx="1.2" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width=".4" transform="translate(0 .35)"/>` +
        prompt(frog, { color: glyphInk(light), size: 0.58, stroke: 2.4 });
      return icon(light, mark, { defs });
    },
  },
  {
    name: "18 · Tiled",
    note: "The focus brick is tiled like tiili's window: a big pane with the prompt and two small panes in project tints.",
    svg: (light) => {
      const [x, y, w, h] = FOCUS, g = 1.1;
      const big = [x, y, w * 0.62, h], right = x + w * 0.62 + g, rw = w - w * 0.62 - g;
      const top = [right, y, rw, (h - g) / 2], bottom = [right, y + (h + g) / 2, rw, (h - g) / 2];
      const mark = plainWall() + rect(big, focusFill(light)) + rect(top, C.ikkuna) + rect(bottom, C.koivu) +
        prompt(big, { color: glyphInk(light), size: 0.5, stroke: 2.4 });
      return icon(light, mark);
    },
  },
  {
    name: "19 · Tampere dusk",
    note: "The ground is an evening sky over red brick, muratti fading to koski (koivu to kalkki in light), showing through the mortar joints.",
    svg: (light) => {
      const defs = `<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">${light
        ? `<stop offset="0" stop-color="${C.koivu}"/><stop offset="1" stop-color="${C.kalkki}"/>`
        : `<stop offset="0" stop-color="${C.muratti}"/><stop offset="1" stop-color="${C.koski}"/>`}</linearGradient>
        <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB27A" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>`;
      const mark = WALL.map((r) => rect(r, C.tiili) + rect(r, "url(#lit)")).join("") +
        rect(FOCUS, focusFill(light)) + rect(FOCUS, "url(#lit)") + prompt(FOCUS, { color: glyphInk(light) });
      return icon(light, mark, { defs, ground: "url(#sky)" });
    },
  },
  {
    name: "20 · Laid in brick",
    note: "The >_ itself is laid in tiny bricks: a stepped chevron and a two-brick underscore, in running bond.",
    svg: (light) => {
      const g = geom(FOCUS, 0.6), ink = glyphInk(light);
      const s = g.ch / 5.2, bw = s * 1.9, bh = s * 0.95;
      let bricks = "";
      for (let i = 0; i < 5; i++) {
        const row = i - 2, x = g.x0 + (2 - Math.abs(row)) * s * 1.05;
        bricks += rect([x, g.cy + row * s * 1.05 - bh / 2, bw, bh], ink, 0.35);
      }
      const uy = g.cy + g.ch / 2 + s * 1.05 - bh;
      bricks += rect([g.cx + s * 0.4, uy, bw, bh], ink, 0.35) + rect([g.cx + s * 0.4 + bw + s * 0.2, uy, bw, bh], ink, 0.35);
      return icon(light, plainWall() + rect(FOCUS, focusFill(light)) + bricks);
    },
  },
  {
    name: "21 · Neon",
    note: "The wall at night: bricks drawn as glowing outlines, and the >_ lit like a neon sign over a bar door.",
    svg: (light) => {
      const defs = `<filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
      const line = light ? C.tiili : "#D9623F", sign = light ? C.muratti : "#FFB27A";
      const outline = (r, c, w = 0.8) => `<rect x="${r[0] + w / 2}" y="${r[1] + w / 2}" width="${r[2] - w}" height="${r[3] - w}" rx="1.5" fill="none" stroke="${c}" stroke-width="${w}"/>`;
      const mark = `<g filter="url(#neon)" opacity=".85">${WALL.map((r) => outline(r, line)).join("")}</g>` +
        `<g filter="url(#neon)">${outline(FOCUS, sign, 1)}${prompt(FOCUS, { color: sign, stroke: 2.2 })}</g>`;
      return icon(light, mark, { defs, ground: light ? C.kalkki : "#0B0F10" });
    },
  },
];

const url = (svg) => "data:image/svg+xml;utf8," + encodeURIComponent(svg);
const img = (svg, size) => `<img src="${url(svg)}" width="${size}" height="${size}" alt="">`;
for (const [id, light] of [["dock-dark", false], ["dock-light", true]]) {
  document.getElementById(id).innerHTML = VARIANTS.map((v) =>
    `<figure>${img(v.svg(light), 64)}<figcaption>${v.name.split(" · ")[0]}</figcaption></figure>`).join("");
}
document.getElementById("variants").innerHTML = VARIANTS.map((v) => `
  <section class="variant">
    <div><h2>${v.name}</h2><p>${v.note}</p></div>
    <div class="sizes">${[false, true].map((light) => `<div class="pair ${light ? "light" : ""}">
      ${[256, 128, 64, 32, 16].map((s) => img(v.svg(light), s)).join("")}</div>`).join("")}</div>
  </section>`).join("");
</script>
</body>
</html>
