<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiili icon, pressed light</title>
<style>
  @font-face { font-family: "Geist Mono"; src: url("../../../src/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1011; color: #e9e2d8; font: 13px/1.5 "Geist Mono", ui-monospace, monospace; padding: 24px 16px 64px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { color: #9a948c; margin: 0 0 24px; max-width: 70ch; }
  .dock { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; padding: 12px 18px 16px; margin: 0 0 20px; border-radius: 22px; width: max-content; max-width: 100%;
    background: linear-gradient(180deg, rgba(120,40,60,.55), rgba(70,20,40,.75)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .dock figure { margin: 0; display: grid; justify-items: center; gap: 6px; }
  .dock figcaption { font-size: 11px; color: #f2d9dd; }
  .dock.light { background: linear-gradient(180deg, rgba(240,226,230,.9), rgba(220,200,210,.9)); }
  .dock.light figcaption { color: #4a2c34; }
  .variant { display: grid; grid-template-columns: 220px 1fr; gap: 16px 24px; padding: 20px 0; border-top: 1px solid #222a2c; }
  .variant h2 { font-size: 14px; margin: 0; }
  .variant p { color: #9a948c; margin: 4px 0 0; }
  .sizes { display: flex; flex-wrap: wrap; gap: 20px; align-items: end; }
  .pair { display: flex; gap: 12px; align-items: end; padding: 12px; border-radius: 12px; background: #161b1d; }
  .pair.light { background: #ece4d8; }
  img { display: block; }
  @media (max-width: 720px) { .variant { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>tiili app icon: variant 15, lit differently</h1>
<p class="lead">Variant 15 (Pressed) with six other ways to light the bricks and press in the &gt;_. Same wall, same palette; only the highlights, shadows and the depth of the prompt change.</p>
<div class="dock" id="dock-dark"></div>
<div class="dock light" id="dock-light"></div>
<div id="variants"></div>

<script>
const C = { tiili: "#A4472B", klinkkeri: "#6B2A1E", savi: "#C9764F", koski: "#111617", kalkki: "#F6F1E9", laasti: "#E8DECD",
  ground: "#182023", ink: "#2A2321", muratti: "#861B22", koivu: "#D9A43A", ikkuna: "#8FA6A4", sammal: "#6E7F4E", taivas: "#6F97B3" };

// ---- variant 11's geometry, in mark units: 7-high courses above and below a 28 × 18 focus brick ----
const FOCUS = [12, 12, 28, 18];
const SHIFT = 4;
const WALL = [
  [0 - SHIFT, 0, 25, 10], [27 - SHIFT, 0, 25, 10],
  [0, 12, 10, 18], [42, 12, 10, 18],
  [0 + SHIFT, 32, 25, 10], [27 + SHIFT, 32, 25, 10],
];
const K = 100 / 28;

const rect = ([x, y, w, h], fill, rx = 1.5, extra = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;

/** Where 11's prompt sits in a box: chevron height `ch`, its left `x0`, centre line `cy`, and the underscore. */
function geom([x, y, w, h], size = 0.56) {
  const ch = h * size, cw = ch * 0.62, gap = ch * 0.32, curW = ch * 0.85;
  const x0 = x + w * 0.17, cy = y + h / 2;
  return { ch, cw, x0, cy, cx: x0 + cw + gap, curW };
}
function prompt(box, { color, stroke = 2.6, size = 0.56, dx = 0, dy = 0 }) {
  const g = geom(box, size);
  const x0 = g.x0 + dx, cy = g.cy + dy;
  return `<path d="M${x0} ${cy - g.ch / 2} L${x0 + g.cw} ${cy} L${x0} ${cy + g.ch / 2}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="square" stroke-linejoin="miter"/>` +
    `<rect x="${g.cx + dx}" y="${cy + g.ch / 2 - stroke / 2}" width="${g.curW}" height="${stroke}" fill="${color}"/>`;
}

/** The icon: ground, then the mark scaled by `k` about the focus brick's centre (optionally rotated), clipped to the squircle. */
function icon(light, mark, { k = K, ground, defs = "", rotate = 0 } = {}) {
  const [fx, fy, fw, fh] = FOCUS;
  const tx = 50 - (fx + fw / 2) * k, ty = 50 - (fy + fh / 2) * k;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>${defs}<clipPath id="sq"><rect width="100" height="100" rx="22.5"/></clipPath></defs>
    <rect width="100" height="100" rx="22.5" fill="${ground ?? (light ? C.kalkki : C.ground)}"/>
    <g clip-path="url(#sq)"><g transform="rotate(${rotate} 50 50) translate(${tx} ${ty}) scale(${k})">${mark}</g></g></svg>`;
}

const focusFill = (light) => (light ? C.klinkkeri : C.savi);
const glyphInk = (light) => (light ? "#FFFFFF" : C.koski);
const plainWall = (fill = C.tiili) => WALL.map((r) => rect(r, fill)).join("");
function rng(seed) { return () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---- lighting kit ----
const DROP = `<filter id="drop" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="0.9" flood-color="#000" flood-opacity=".55"/></filter>`;
const grad = (id, stops, [x1, y1, x2, y2] = [0, 0, 0, 1]) =>
  `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join("")}</linearGradient>`;
/** A chiselled bevel: light top and left faces, dark bottom and right, `b` wide. */
function chisel([x, y, w, h], b = 1.1, light = 0.32, dark = 0.4) {
  const X = x + w, Y = y + h;
  const poly = (pts, c, a) => `<polygon points="${pts.map((p) => p.join(",")).join(" ")}" fill="${c}" fill-opacity="${a}"/>`;
  return poly([[x, y], [X, y], [X - b, y + b], [x + b, y + b]], "#fff", light) +
    poly([[x, y], [x + b, y + b], [x + b, Y - b], [x, Y]], "#fff", light * 0.55) +
    poly([[x, Y], [x + b, Y - b], [X - b, Y - b], [X, Y]], "#000", dark) +
    poly([[X, y], [X, Y], [X - b, Y - b], [X - b, y + b]], "#000", dark * 0.6);
}
/** The prompt pressed in (shadow above, light lip below) or raised (light above, shadow below). */
function pressedPrompt(light, mode = "in", depth = 0.5) {
  const ink = glyphInk(light);
  const lip = light ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.4)", shade = "rgba(0,0,0,.45)";
  if (mode === "in") return prompt(FOCUS, { color: shade, dy: -depth }) + prompt(FOCUS, { color: lip, dy: depth }) + prompt(FOCUS, { color: ink });
  return prompt(FOCUS, { color: "rgba(0,0,0,.5)", dy: depth * 1.4, dx: depth * 0.4 }) + prompt(FOCUS, { color: lip, dy: -depth * 0.6 }) + prompt(FOCUS, { color: ink });
}
/** A wall where every brick (and the focus brick, dropped) gets `finish(r)` laid over its fill. */
function lit(light, finish, { defs = "", glyph = pressedPrompt(light), focusDrop = true } = {}) {
  const mark = WALL.map((r) => rect(r, C.tiili) + finish(r, false)).join("") +
    (focusDrop ? `<g filter="url(#drop)">${rect(FOCUS, focusFill(light))}</g>` : rect(FOCUS, focusFill(light))) +
    finish(FOCUS, true) + glyph;
  return icon(light, mark, { defs: DROP + defs });
}

const VARIANTS = [
  {
    name: "15 · Pressed",
    note: "The pick, for comparison: a thin lit top edge, a shaded bottom, a shadow under the focus brick and a pressed-in >_.",
    svg: (light) => lit(light, (r) => rect(r, "url(#bevel)"), {
      defs: grad("bevel", [[0, "#fff", 0.28], [0.12, "#fff", 0], [0.85, "#000", 0], [1, "#000", 0.35]]),
      glyph: prompt(FOCUS, { color: light ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.35)", dy: 0.5 }) + prompt(FOCUS, { color: glyphInk(light) }),
    }),
  },
  {
    name: "15a · Pillow",
    note: "Soft and rounded: the light falls off gently from the top over the whole face, so each brick looks plump.",
    svg: (light) => lit(light, (r) => rect(r, "url(#pillow)"), {
      defs: grad("pillow", [[0, "#fff", 0.3], [0.45, "#fff", 0.04], [0.7, "#000", 0.02], [1, "#000", 0.32]]),
    }),
  },
  {
    name: "15b · Chiselled",
    note: "Crisp facets: light top and left faces, dark bottom and right, like a pressed brick with sharp arrises.",
    svg: (light) => lit(light, (r, focus) => chisel(r, focus ? 1.3 : 1.1)),
  },
  {
    name: "15c · Rim light",
    note: "Only edges catch the light: a hairline highlight along each top and a dark hairline at each bottom; the faces stay flat.",
    svg: (light) => lit(light, ([x, y, w, h]) =>
      `<rect x="${x + 0.9}" y="${y + 0.25}" width="${w - 1.8}" height="0.45" rx="0.2" fill="#fff" fill-opacity=".55"/>` +
      `<rect x="${x + 0.6}" y="${y + h - 0.6}" width="${w - 1.2}" height="0.6" rx="0.25" fill="#000" fill-opacity=".4"/>`),
  },
  {
    name: "15d · Glazed",
    note: "A glazed brick: a glossy sheen across the upper half of every face, like the glazed brick of an old station.",
    svg: (light) => lit(light, ([x, y, w, h]) =>
      `<rect x="${x + 0.6}" y="${y + 0.5}" width="${w - 1.2}" height="${h * 0.42}" rx="1.2" fill="url(#gloss)"/>` + rect([x, y, w, h], "url(#base)"), {
      defs: grad("gloss", [[0, "#fff", 0.45], [1, "#fff", 0.06]]) + grad("base", [[0.6, "#000", 0], [1, "#000", 0.3]]),
    }),
  },
  {
    name: "15e · Raking light",
    note: "Low sun from the upper left: each brick shades diagonally, light at the top-left corner to dark at the bottom-right.",
    svg: (light) => lit(light, (r) => rect(r, "url(#rake)"), {
      defs: grad("rake", [[0, "#fff", 0.3], [0.5, "#fff", 0], [1, "#000", 0.38]], [0, 0, 1, 1]),
    }),
  },
  {
    name: "15f · Raised prompt",
    note: "15's bricks with the >_ standing proud instead of pressed in: lit on top, casting a small shadow down and right.",
    svg: (light) => lit(light, (r) => rect(r, "url(#bevel)"), {
      defs: grad("bevel", [[0, "#fff", 0.28], [0.12, "#fff", 0], [0.85, "#000", 0], [1, "#000", 0.35]]),
      glyph: pressedPrompt(light, "out", 0.55),
    }),
  },
];

const url = (svg) => "data:image/svg+xml;utf8," + encodeURIComponent(svg);
const img = (svg, size) => `<img src="${url(svg)}" width="${size}" height="${size}" alt="">`;
for (const [id, light] of [["dock-dark", false], ["dock-light", true]]) {
  document.getElementById(id).innerHTML = VARIANTS.map((v) =>
    `<figure>${img(v.svg(light), 64)}<figcaption>${v.name.split(" · ")[0]}</figcaption></figure>`).join("");
}
document.getElementById("variants").innerHTML = VARIANTS.map((v) => `
  <section class="variant">
    <div><h2>${v.name}</h2><p>${v.note}</p></div>
    <div class="sizes">${[false, true].map((light) => `<div class="pair ${light ? "light" : ""}">
      ${[256, 128, 64, 32, 16].map((s) => img(v.svg(light), s)).join("")}</div>`).join("")}</div>
  </section>`).join("");
</script>
</body>
</html>
