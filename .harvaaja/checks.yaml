# Checks for tiili: a Tauri 2 app (Rust in src-tauri/, TypeScript + Vite frontend, npm).
setup:
  check: install
  clean: [node_modules]
checks:
  - name: install
    run: npm ci --no-audit --no-fund --cache "$TMPDIR/harvaaja-npm-cache" && cargo fetch --locked --manifest-path src-tauri/Cargo.toml
    network: [registry.npmjs.org, index.crates.io, static.crates.io]
    timeoutSeconds: 600
  - name: openspec
    run: openspec validate --all --strict --no-interactive
    stage: every
    timeoutSeconds: 120
  - name: typecheck
    run: npm run typecheck
    stage: every
    timeoutSeconds: 300
  - name: lint
    run: npm run lint
    stage: every
    timeoutSeconds: 300
  - name: unit
    run: npm test
    stage: every
    timeoutSeconds: 300
  - name: cargo-fmt
    run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
    stage: every
    timeoutSeconds: 120
  - name: cargo-clippy
    run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    stage: every
    timeoutSeconds: 1200
  # Every Rust test the sandbox can run. Tests that need a pseudo-terminal (or anything else the sandbox refuses)
  # are #[ignore = "host: ..."] and tagged @harvaaja-test-tier: host, so they are skipped here.
  - name: cargo-test
    run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins --tests
    stage: every
    timeoutSeconds: 1200
  # The whole Rust suite, host tests included, outside the sandbox before a release.
  - name: cargo-test-host
    run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins --tests -- --include-ignored
    stage: release
    sandbox: none
    timeoutSeconds: 1200
  # Design preview: the Vite dev server for the frontend, on the port härvääjä assigns.
  - name: design
    run: npm run dev -- --port "$HV_PREVIEW_PORT" --strictPort
    role: design
    stage: manual
