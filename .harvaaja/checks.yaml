# Checks for tiili: a Tauri 2 app (Rust in src-tauri/, TypeScript + Vite frontend, npm).
setup:
  check: install
  clean: [node_modules]
checks:
  - name: install
    run: npm ci --no-audit --no-fund --cache "$TMPDIR/harvaaja-npm-cache" && cargo fetch --locked --manifest-path src-tauri/Cargo.toml
    network: [registry.npmjs.org, index.crates.io, static.crates.io]
    timeoutSeconds: 600
  - name: openspec
    run: openspec validate --all --strict --no-interactive
    stage: every
    timeoutSeconds: 120
  - name: typecheck
    run: npm run typecheck
    stage: every
    timeoutSeconds: 300
  - name: lint
    run: npm run lint
    stage: every
    timeoutSeconds: 300
  - name: unit
    run: npm test
    stage: every
    timeoutSeconds: 300
  - name: cargo-fmt
    run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
    stage: every
    timeoutSeconds: 120
  - name: cargo-clippy
    run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    stage: every
    timeoutSeconds: 1200
  # Unit tests only: the PTY integration test needs a pseudo-terminal, which the sandbox refuses.
  - name: cargo-test
    run: cargo test --manifest-path src-tauri/Cargo.toml --lib --bins
    stage: every
    timeoutSeconds: 1200
  - name: cargo-test-pty
    run: cargo test --manifest-path src-tauri/Cargo.toml --test pty_session
    stage: release
    sandbox: none
    timeoutSeconds: 1200
  # Design preview: the Vite dev server for the frontend, on the port härvääjä assigns.
  - name: design
    run: npm run dev -- --port "$HV_PREVIEW_PORT" --strictPort
    role: design
    stage: manual
