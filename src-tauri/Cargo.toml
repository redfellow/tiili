[package]
name = "tiili"
version = "0.1.0"
description = "A terminal for working in many repositories at once"
edition = "2021"
publish = false
default-run = "tiili"

[lib]
name = "tiili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the dev-bridge binary (browser dev server) uses it; the app bundle ships the tiili binary alone.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
libproc = "0.14"
# Swapping the Dock icon at run time (src/app_icon.rs); tauri already depends on these versions.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
