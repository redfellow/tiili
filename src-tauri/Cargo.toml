[package]
name = "tiili"
version = "0.2.0"
description = "A terminal for working in many repositories at once"
edition = "2021"
publish = false
default-run = "tiili"

[lib]
name = "tiili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the dev-bridge binary (browser dev server) uses it, so it comes with the dev-bridge feature.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
tauri-plugin-window-state = "2"

[features]
# The browser dev server's shell bridge (src/bin/dev-bridge.rs) and its test. On by default, so cargo build, test and
# clippy cover it; `npm run bundle` and `npm run install-app` build without default features, because Tauri's
# bundler puts every binary of the package into the installers and the bridge must never reach users.
default = ["dev-bridge"]
dev-bridge = ["dep:tungstenite"]

[[bin]]
name = "dev-bridge"
path = "src/bin/dev-bridge.rs"
required-features = ["dev-bridge"]

[[test]]
name = "dev_bridge"
path = "tests/dev_bridge.rs"
required-features = ["dev-bridge"]

# This machine's hostname (src/cwd.rs) on every Unix; the pane's process info on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
# Swapping the Dock icon at run time (src/app_icon.rs); tauri already depends on these versions.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
